worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # вбудований DNS Docker: імена app1..app3 перевіряються кожні 5 с,
    # тож зупинений екземпляр зникає з пулу, а відновлений — повертається
    resolver 127.0.0.11 valid=5s ipv6=off;

    # у лозі видно, який екземпляр обробив запит
    log_format upstream '$remote_addr "$request" $status '
                        'upstream=$upstream_addr upstream_status=$upstream_status '
                        'rt=$request_time';
    access_log /dev/stdout upstream;
    error_log /dev/stderr warn;

    upstream farm_api {
        zone farm_api 64k;
        # алгоритм за замовчуванням — round robin (по черзі)
        # max_fails/fail_timeout: після 1 невдалого запиту екземпляр виключається на 10 с
        server app1:8000 resolve max_fails=1 fail_timeout=10s;
        server app2:8000 resolve max_fails=1 fail_timeout=10s;
        server app3:8000 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 80;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://farm_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;

            # якщо екземпляр не відповів, запит повторюється на наступному
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;

            add_header X-Upstream $upstream_addr always;
        }
    }
}
