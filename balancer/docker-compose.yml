name: farm-balancer

# спільні налаштування трьох екземплярів застосунку
x-app: &app
  build:
    context: .
    additional_contexts:
      lambda: ../serverless/lambda   # Lambda-обробник з ЛР-8
  image: farm-api:1.0.0
  depends_on:
    localstack:
      condition: service_healthy

x-app-env: &app-env
  TABLE_NAME: farms
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

services:
  localstack:
    image: localstack/localstack:4.12
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: dynamodb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
    ports:
      - "127.0.0.1:8001:8000"   # прямий доступ без балансувальника (для порівняння)

  app2:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app2
    ports:
      - "127.0.0.1:8002:8000"

  app3:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app3
    ports:
      - "127.0.0.1:8003:8000"

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      - "127.0.0.1:8080:80"     # єдина точка входу
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
