version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: farm_db
    restart: always
    environment:
      POSTGRES_DB: farm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: farm_web
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgrespassword
      - PG_DB=farm_db
    depends_on:
      - db

volumes:
  postgres_data: