services:
  db:
    image: postgres:15-alpine
    container_name: farm_db
    restart: always
    environment:
      POSTGRES_DB: farm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d farm_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    container_name: farm_web
    restart: always
    ports:
      - "5002:5000"
    environment:
      - PG_HOST=db
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgrespassword
      - PG_DATABASE=farm_db
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
