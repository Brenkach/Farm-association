apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: farm-association
  labels:
    app: postgres
    app.kubernetes.io/part-of: farm-association
spec:
  replicas: 1
  strategy:
    type: Recreate          # том RWO може бути змонтований лише одним подом
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: farm-association
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: farm-config, key: PG_DATABASE }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: farm-config, key: PG_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: farm-secret, key: PG_PASSWORD }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
