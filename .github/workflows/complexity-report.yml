name: Complexity Report

# Лаб. 7, завдання 3: хмарний збір метрик складності (Lizard, Radon) і Churn Rate (Git)
# та побудова матриці Hotspots. Запускається при кожному push і pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  complexity-report:
    runs-on: ubuntu-latest
    steps:
      # Повна історія потрібна для git log (Churn Rate), тому fetch-depth: 0
      - name: Checkout (повна історія)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      # Сканери ставляться з закріпленими версіями та хешами (requirements-dev.txt)
      - name: Встановлення CLI-сканерів (Lizard, Radon)
        run: |
          pip install --no-cache-dir --only-binary :all: --require-hashes -r requirements-dev.txt

      - name: Звіт складності (Lizard CSV та Radon JSON)
        run: |
          mkdir -p complexity-report
          lizard -l python --csv $(git ls-files '*.py') > complexity-report/lizard.csv
          radon cc -j $(git ls-files '*.py') > complexity-report/radon-cc.json
          radon hal -j $(git ls-files '*.py') > complexity-report/radon-halstead.json

      - name: Churn Rate за 90 днів (git log)
        run: |
          git log --since="90 days ago" --format=format: --name-only | egrep -v '^$' | sort | uniq -c | sort -nr > complexity-report/churn-90d.txt
          echo "Топ-10 за кількістю комітів:"
          head -10 complexity-report/churn-90d.txt

      - name: Матриця Hotspots
        run: |
          # У матрицю входить лише код продукту: тести та службові скрипти виключено
          python ci/hotspots.py --lizard complexity-report/lizard.csv --churn complexity-report/churn-90d.txt \
            --json complexity-report/hotspots.json --md complexity-report/hotspots.md \
            --churn-threshold 3 \
            --exclude 'tests/*' 'experiments/*' 'ci/*' 'git-hooks/*' demo_lab4.py halstead_scan.py load_test.py audit_demo.py
          cat complexity-report/hotspots.md >> "$GITHUB_STEP_SUMMARY"

      - name: Публікація артефакту
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complexity-report
          path: complexity-report/
          if-no-files-found: error
