name: Flask CI

on:
  push:
    branches:
      - main
      - lab3
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install pytest pip-audit

    - name: Run tests
      run: pytest tests/ -v

    # SCA: перевірка залежностей на відомі вразливості (ненульовий код при знахідках)
    - name: SCA audit (pip-audit)
      run: pip-audit -r requirements.txt
