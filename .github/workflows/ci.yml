name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, Devops]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.9"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/farm-association

jobs:
  # ---------- 3. Статичний аналіз (блокуючий) ----------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        # формат github -> помилки видно прямо в PR як анотації
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ---------- 2. Збірка і тести (matrix, незалежно) ----------
  test:
    name: Build & Test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # падіння одного не скасовує інші
      matrix:
        suite: [unit, integration]

    # параметри збігаються з tests/conftest.py
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: farm_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PG_HOST: localhost
      PG_PORT: "5433"
      PG_USER: postgres
      PG_PASSWORD: postgrespassword
      PG_DATABASE: farm_test
      SECRET_KEY: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Build
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          python -m compileall -q .
          python -c "from app import create_app; print('app import OK')"

      - name: Test
        run: pytest tests/test_${{ matrix.suite }}.py -v

  # ---------- 4-5. Docker: збірка, сканування, публікація ----------
  docker:
    name: Docker build & publish
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: farm-association:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: farm-association:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
