name: Flask CI

on:
  push:
    branches:
      - main
      - lab3
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install --only-binary :all: --require-hashes -r requirements.txt
        pip install --only-binary :all: --require-hashes -r requirements-dev.txt

    - name: Run tests
      run: pytest tests/ -v

    # SCA: перевірка залежностей на відомі вразливості (ненульовий код при знахідках)
    - name: SCA audit (pip-audit)
      run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
    - name: Gitleaks
      uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
