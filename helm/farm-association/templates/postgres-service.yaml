apiVersion: v1
kind: Service
metadata:
  name: {{ include "farm.postgresName" . }}
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    {{- include "farm.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
  ports:
    - port: 5432
      targetPort: 5432
