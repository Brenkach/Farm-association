apiVersion: v1
kind: Pod
metadata:
  name: {{ include "farm.fullname" . }}-test-health
  labels:
    {{- include "farm.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget -qO- http://{{ include "farm.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }} | tee /dev/stderr | grep '"status":"ok"'
