apiVersion: v1
kind: Secret
metadata:
  name: {{ include "farm.fullname" . }}-secret
  labels:
    {{- include "farm.labels" . | nindent 4 }}
type: Opaque
data:
  PG_PASSWORD: {{ required "secret.pgPassword is required" .Values.secret.pgPassword | b64enc | quote }}
  SECRET_KEY: {{ required "secret.secretKey is required" .Values.secret.secretKey | b64enc | quote }}
