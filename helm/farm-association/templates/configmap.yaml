apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "farm.fullname" . }}-config
  labels:
    {{- include "farm.labels" . | nindent 4 }}
data:
  PG_HOST: {{ include "farm.pgHost" . | quote }}
  PG_PORT: {{ .Values.config.pgPort | quote }}
  PG_DATABASE: {{ .Values.config.pgDatabase | quote }}
  PG_USER: {{ .Values.config.pgUser | quote }}
