{% extends "base.html" %}
{% block title %}Відновлення паролю — Асоціація ФГ{% endblock %}

{% block body %}

<section class="card lynx-card lynx-narrow">

  <h1 class="h-title lynx-title">Відновлення паролю</h1>

  {% if msg %}
    <div class="alert alert-danger lynx-alert">{{ msg }}</div>
  {% endif %}

  {% if success %}
    <div class="alert lynx-alert">{{ success }}</div>
  {% endif %}

  <form method="POST" class="section lynx-section">

    <div class="lynx-field">
      <label class="form-label lynx-label">Логін</label>
      <input class="input lynx-input"
             type="text"
             name="login"
             required>
    </div>

    <div class="lynx-field">
      <label class="form-label lynx-label">Новий пароль</label>
      <input class="input lynx-input"
             type="password"
             name="password"
             required>
    </div>

    <div class="lynx-field">
      <label class="form-label lynx-label">Повторіть пароль</label>
      <input class="input lynx-input"
             type="password"
             name="confirm"
             required>
    </div>

    <div class="form-actions lynx-actions">
      <button class="btn btn-primary lynx-btn-primary" type="submit">
        Змінити пароль
      </button>

{% endblock %}
