{% extends "base.html" %}
{% block title %}Редагування працівника{% endblock %}

{% block body %}
<section class="section card lynx-card">

  <h1 class="h-title lynx-title">Редагування працівника</h1>

  {% if msg %}
    <div class="alert alert-danger lynx-alert">{{ msg }}</div>
  {% endif %}

  <form method="post" class="form-grid lynx-grid">

    <label class="form-label lynx-label">ПІБ</label>
    <input name="full_name"
           class="input lynx-input"
           value="{{ emp.full_name }}" required>

    <label class="form-label lynx-label">Посада</label>
    <input name="position"
           class="input lynx-input"
           value="{{ emp.position }}" required>

    <label class="form-label lynx-label">Дата найму</label>
    <input name="hire_date"
           type="date"
           class="input lynx-input"
           value="{{ emp.hire_date }}">

    <label class="form-label lynx-label">Оклад, грн</label>
    <input name="monthly_salary"
           type="number" step="0.01"
           class="input lynx-input"
           value="{{ emp.monthly_salary }}">

    <label class="form-label lynx-label">Адреса</label>
    <input name="address"
           class="input lynx-input"
           value="{{ emp.address }}">

    <label class="form-label lynx-label">Телефон</label>
    <input name="phone"
           class="input lynx-input"
           value="{{ emp.phone }}">

    <label class="form-label lynx-label">Логін користувача</label>
    <input name="account_login"
           class="input lynx-input"
           value="{{ emp.user_login }}" required>

    <p class="h-info lynx-info">
      * Якщо ви зміните логін, юзеру буде створено новий акаунт
      з паролем <b>changeme123</b>.
    </p>

    <div class="form-actions lynx-actions">
      <button class="btn btn-primary lynx-btn-primary">Зберегти</button>
      <a class="btn btn-ghost lynx-btn-ghost"
         href="{{ url_for('employees') }}">Назад</a>
    </div>

  </form>

</section>
{% endblock %}
